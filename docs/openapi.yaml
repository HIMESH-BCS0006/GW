        completed_at:
          type: string
          format: date-time
          nullable: true
          description: Completion timestamp.
        outcome:
          $ref: '#/components/schemas/StopOutcome'
          nullable: true
        quantity_delivered:
          type: integer
          nullable: true
          description: Total unit quantity delivered.
        received_by:
          type: string
          nullable: true
          description: Person accepting delivery at outlet.
        outcome_note:
          type: string
          nullable: true
          description: Driver notes on stop execution.
        device_ts:
          type: string
          format: date-time
          nullable: true
