        - reference
      x-role:
        - dispatcher
        - loader
        - driver
        - store_manager
      security:
        - BearerAuth: []
      parameters:
        - name: stream_token
          in: query
          required: false
          schema:
            type: string
          description: Short-lived stream token in query string since EventSource cannot set headers.
          example: st_89123812903810239
      responses:
        '200':
          description: |
            Server-Sent Events stream emitting domain events (`order.submitted`, `order.deferred`, `order.cancelled`, `plan.generated`, `trip.confirmed`, `trip.updated`, `loading.shortfall`, `shortfall.resolved`, `trip.loaded`, `trip.started`, `stop.arrived`, `stop.outcome`, `stop.exception`, `exception.decided`, `receipt.confirmed`, `receipt.discrepancy`, `sync.reconciled`, `sync.conflict`, `run.closed`).
            Clients fallback to 15s polling if SSE disconnects.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/Event'
              example:
                id: EVT001
                type: order.submitted
                occurred_at: "2025-07-31T14:00:00+05:30"
                entity:
                  type: order
                  id: ORD-20250801-001
                data: {}

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer authentication header. Role and scope are derived from the token.

  schemas:
    # ----------------------------------------------------
    # Enums
    # ----------------------------------------------------
    Brand:
      type: string
      enum:
        - Fresh
        - Style
        - Tech
      description: Operating retail brand of Waypoint Group.

    Role:
      type: string
      enum:
        - dispatcher
        - loader
        - driver
        - store_manager
      description: User role within the Waypoint delivery planning system.

    VehicleStatus:
      type: string
      enum:
        - available
        - in_workshop
      description: Operational status of a vehicle.

    TemperatureRequirement:
      type: string
      enum:
        - chilled
        - ambient
      description: Temperature requirement for orders or vehicles.

    VehicleType:
      type: string
      enum:
        - truck
        - van
      description: Classification of vehicle.

    DockType:
      type: string
      enum:
        - rear_dock
        - street
        - mall_bay
      description: Unloading facility type at an outlet.

    ParkingConstraint:
      type: string
      enum:
        - normal
        - van_only
        - mall_dock
      description: Access constraint for parking/unloading at an outlet.

    OrderStatus:
      type: string
      enum:
        - SUBMITTED
        - PLANNED
        - SCHEDULED
        - LOADED
        - IN_TRANSIT
        - DELIVERED
        - PARTIALLY_DELIVERED
        - DEFERRED
        - CANCELLED
      description: Lifecycle status of an order.

    PlanRunStatus:
      type: string
      enum:
        - OPEN
        - CLOSED
      description: Status of a daily planning run.

    TripStatus:
      type: string
      enum:
        - DRAFT
        - CONFIRMED
        - LOADING
        - LOADED
        - IN_PROGRESS
        - COMPLETED
        - BLOCKED
        - CANCELLED
      description: Status of a delivery trip.

    StopStatus:
      type: string
      enum:
        - PENDING
        - ARRIVED
        - DELIVERED
        - PARTIAL
        - FAILED
        - EXCEPTION
        - SKIPPED
      description: Status of an individual trip stop.

    ReceiptStatus:
      type: string
      enum:
        - NONE
        - AWAITING
        - CONFIRMED
        - DISCREPANCY
      description: Store manager receipt confirmation status for a stop.

    StopOutcome:
      type: string
      enum:
        - delivered
        - partial
        - refused
        - closed
      description: Outcome recorded by the driver at a stop.

    ReceiptOutcome:
      type: string
      enum:
        - full
        - discrepancy
      description: Outcome recorded by the store manager upon receipt.

    LoadCheckIssue:
      type: string
      enum:
        - missing
        - damaged
      description: Issue reported during loading check.

    LoadCheckStatus:
      type: string
      enum:
        - OPEN
        - RESOLVED
      description: Status of a load check shortfall report.

    LoadCheckResolution:
      type: string
      enum:
        - defer_order
        - replan_order
        - proceed_partial
      description: Dispatcher resolution for a loading shortfall.

    DeferralReasonCode:
      type: string
      enum:
        - NO_REEFER
        - NO_VAN
        - TOO_LARGE
        - WINDOW_INFEASIBLE
        - CAPACITY_FULL
        - TIME_BUDGET
        - TRIP_LIMIT
        - FUEL_QUOTA
        - SHORTFALL
        - DELIVERY_FAILED
        - EXCEPTION_SKIPPED
        - MANUAL
      description: Causal code for deferring an order.

    DeferralReasonClass:
      type: string
      enum:
        - UNAVOIDABLE
        - CHOICE
        - OPERATIONAL
        - DISPATCHER
      description: Classification of deferral cause.

    DeferralDecidedBy:
      type: string
      enum:
        - engine
        - dispatcher
        - system
      description: Decision authority for a deferral.

    ExceptionType:
      type: string
      enum:
        - dock_blocked
        - outlet_closed
        - vehicle_issue
        - access_problem
        - other
      description: Type of field exception reported by driver.

    ExceptionStatus:
      type: string
      enum:
        - OPEN
        - DECIDED
      description: Resolution status of a field exception.

    ExceptionDecision:
      type: string
      enum:
        - retry
        - skip
      description: Dispatcher decision on a field exception.

    SyncOpResult:
      type: string
      enum:
        - applied
        - replayed
        - applied_with_conflict
        - rejected
      description: Outcome of an offline operation sync replay.

    EventType:
      type: string
      enum:
        - order.submitted
        - order.deferred
        - order.cancelled
        - plan.generated
        - trip.confirmed
        - trip.updated
        - loading.shortfall
        - shortfall.resolved
        - trip.loaded
        - trip.started
        - stop.arrived
        - stop.outcome
        - stop.exception
        - exception.decided
        - receipt.confirmed
        - receipt.discrepancy
        - sync.reconciled
        - sync.conflict
        - run.closed
      description: Domain event type for live updates and SSE.

    # ----------------------------------------------------
    # Error Envelope & Rule Violations
    # ----------------------------------------------------
    Violation:
      type: object
      required:
        - rule
        - message
      properties:
        rule:
          type: string
          description: Rule ID (e.g. H1 through H12).
        message:
          type: string
          description: Human-readable description of rule violation.
        actual:
          description: Observed value that violated constraint.
        limit:
          description: Threshold limit specified by the rule.
      description: Constraint violation detail item.

    ErrorDetails:
      type: object
      properties:
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
          description: List of rule violations if code is CONSTRAINT_VIOLATION.
      additionalProperties: true
      description: Detailed contextual metadata for error payload.

    ErrorBody:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Error code (e.g. CONSTRAINT_VIOLATION, PLAN_CHANGED, NOT_OPERATING_DAY, INVALID_TRANSITION, FORBIDDEN_SCOPE, OPEN_SHORTFALL, STALE_PLAN_VERSION).
        message:
          type: string
          description: High-level error message.
        details:
          $ref: '#/components/schemas/ErrorDetails'
      description: Core error payload.

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      description: Standard API error response envelope.

    # ----------------------------------------------------
    # Domain Model & DTO Schemas
    # ----------------------------------------------------
    Depot:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: Unique depot identifier (e.g. Peliyagoda, Kandy).
        name:
          type: string
          description: Name of the distribution center or regional hub.
      description: Distribution center depot.

    District:
      type: object
      required:
        - district
        - depot
        - road_class
        - free_flow_kmh
        - depot_to_district_km
        - depot_to_district_freeflow_min
        - inter_stop_km
        - inter_stop_freeflow_min
      properties:
        district:
          type: string
          description: Name of the district.
        depot:
          type: string
          description: Serving depot name/ID.
        road_class:
          type: string
          description: Classification of road network (urban, suburban, highway, hill).
        free_flow_kmh:
          type: integer
          description: Free-flow travel speed in km/h.
        depot_to_district_km:
          type: number
          description: Distance from depot to district center in km.
        depot_to_district_freeflow_min:
          type: integer
          description: Free-flow travel time from depot to district in minutes.
        inter_stop_km:
          type: number
          description: Average inter-stop distance within district in km.
        inter_stop_freeflow_min:
          type: integer
          description: Average inter-stop travel time in minutes.
      description: Geographic district and travel reference data.

    Outlet:
      type: object
      required:
        - outlet_id
        - brand
        - district
        - depot
        - dock_type
        - parking_constraint
        - window_open_time
        - window_close_time
      properties:
        outlet_id:
          type: string
          description: Unique outlet code (e.g. OUT001).
        brand:
          $ref: '#/components/schemas/Brand'
        district:
          type: string
          description: District name where outlet is situated.
        depot:
          type: string
          description: Designated serving depot.
        dock_type:
          $ref: '#/components/schemas/DockType'
        parking_constraint:
          $ref: '#/components/schemas/ParkingConstraint'
        mall_window:
          type: string
          nullable: true
          description: Fixed access window for mall outlets (HH:MM-HH:MM), if applicable.
        window_open_time:
          type: string
          description: Delivery window opening time (HH:MM).
        window_close_time:
          type: string
          description: Delivery window closing time (HH:MM).
      description: Retail outlet reference model.

    Vehicle:
      type: object
      required:
        - vehicle_id
        - type
        - temp
        - weight_cap_kg
        - volume_cap_m3
        - fuel_type
        - km_per_l
        - weekly_fuel_quota_l
        - depot
      properties:
        vehicle_id:
          type: string
          description: Unique vehicle code (e.g. VEH001).
        type:
          $ref: '#/components/schemas/VehicleType'
        temp:
          $ref: '#/components/schemas/TemperatureRequirement'
        weight_cap_kg:
          type: number
          description: Maximum weight capacity in kilograms.
        volume_cap_m3:
          type: number
          description: Maximum volume capacity in cubic meters.
        fuel_type:
          type: string
          description: Fuel specification (e.g. diesel).
        km_per_l:
          type: number
          description: Fuel efficiency in km per litre.
        weekly_fuel_quota_l:
          type: number
          description: Weekly fuel allowance limit in litres.
        depot:
          type: string
          description: Home depot assignment.
      description: Fleet vehicle reference model.

    ServiceAllowance:
      type: object
      required:
        - brand
        - rear_dock
        - street
        - mall_bay
      properties:
        brand:
          $ref: '#/components/schemas/Brand'
        rear_dock:
          type: integer
          description: Service allowance minutes for rear dock stops.
        street:
          type: integer
          description: Service allowance minutes for street dock stops.
        mall_bay:
          type: integer
          description: Service allowance minutes for mall bay stops.
      description: Planning allowance per stop in minutes by brand and dock type.

    CalendarDay:
      type: object
      required:
        - date
        - dow
        - dow_name
        - is_weekend
        - iso_year
        - iso_week
        - is_payday
        - festival_ramp
        - is_holiday
        - monsoon
        - is_operating
      properties:
        date:
          type: string
          format: date
          description: Calendar date (YYYY-MM-DD).
        dow:
          type: integer
          description: Day of week index (0 = Monday).
        dow_name:
          type: string
          description: Day of week name.
        is_weekend:
          type: integer
          description: 1 if weekend, else 0.
        iso_year:
          type: integer
          description: ISO calendar year.
        iso_week:
          type: integer
          description: ISO calendar week number.
        is_payday:
          type: integer
          description: 1 if payday, else 0.
        festival:
          type: string
          nullable: true
          description: Name of festival if applicable.
        festival_ramp:
          type: number
          description: Festival proximity ramp index (0.0 to 1.0).
        is_holiday:
          type: integer
          description: 1 if public holiday, else 0.
        monsoon:
          type: integer
          description: 1 if monsoon season active, else 0.
        is_operating:
          type: integer
          description: 1 if Waypoint operates on this date, 0 if closed.
      description: Operating calendar reference data.

    User:
      type: object
      required:
        - id
        - username
        - role
        - display_name
      properties:
        id:
          type: string
          description: User ID.
        username:
          type: string
          description: Login username / email address.
        role:
          $ref: '#/components/schemas/Role'
        depot_ids:
          type: array
          items:
            type: string
          description: Depot scoping list for dispatcher or loader (D24).
        outlet_id:
          type: string
          nullable: true
          description: Outlet scoping for store manager.
        vehicle_id:
          type: string
          nullable: true
          description: Vehicle scoping for driver.
        display_name:
          type: string
          description: Human-readable display name.
      description: System user account model.

    UserDepotAccess:
      type: object
      required:
        - user_id
        - depot_id
      properties:
        user_id:
          type: string
        depot_id:
          type: string
      description: Mapping model for dispatcher/loader depot access.

    VehicleAvailability:
      type: object
      required:
        - vehicle_id
        - date
        - status
      properties:
        vehicle_id:
          type: string
          description: Vehicle code.
        date:
          type: string
          format: date
          description: Service date.
        status:
          $ref: '#/components/schemas/VehicleStatus'
        note:
          type: string
          nullable: true
          description: Operational note (e.g. workshop reason).
      description: Daily availability status of a vehicle.

    Order:
      type: object
      required:
        - id
        - outlet_id
        - delivery_date
        - placed_at
        - status
        - temp_requirement
        - order_units
        - order_weight_kg
        - order_volume_m3
        - rolled_over
        - deferral_count
      properties:
        id:
          type: string
          description: Order identifier.
        outlet_id:
          type: string
          description: Consignee outlet code.
        delivery_date:
          type: string
          format: date
          description: Target delivery date (YYYY-MM-DD).
        requested_delivery_date:
          type: string
          format: date
          nullable: true
          description: Original requested delivery date if order rolled over (D18).
        placed_at:
          type: string
          format: date-time
          description: Placement timestamp in UTC.
        status:
          $ref: '#/components/schemas/OrderStatus'
        temp_requirement:
          $ref: '#/components/schemas/TemperatureRequirement'
        order_units:
          type: integer
          description: Quantity of units ordered.
        order_weight_kg:
          type: number
          description: Total weight in kg (always non-null in responses; D18).
        order_volume_m3:
          type: number
          description: Total volume in m3 (always non-null in responses; D18).
        rolled_over:
          type: boolean
          description: True if order was placed after 16:00 cutoff and rolled over.
        deferral_count:
          type: integer
          description: Number of times this order has been deferred.
        cancel_reason:
          type: string
          nullable: true
          description: Mandatory reason if order was cancelled.
        trip_id:
          type: string
          nullable: true
          description: Assigned trip ID if planned or scheduled (D19).
        stop_id:
          type: string
          nullable: true
          description: Assigned stop ID if planned or scheduled (D19).
        eta:
          type: string
          nullable: true
          description: Estimated arrival time HH:MM (D19).
        note:
          type: string
          nullable: true
          description: Operational or delivery note.
        client_op_id:
          type: string
          format: uuid
          nullable: true
          description: Idempotency client operation UUID.
      description: Commercial delivery order model.

    OutletServiceState:
      type: object
      required:
        - outlet_id
        - consecutive_deferrals
      properties:
        outlet_id:
          type: string
          description: Outlet code.
        last_served_date:
          type: string
          format: date
          nullable: true
          description: Date of last completed delivery.
        last_deferred_date:
          type: string
          format: date
          nullable: true
          description: Date of last deferred order.
        consecutive_deferrals:
          type: integer
          description: Count of consecutive unserved runs.
      description: Historical service tracking state for an outlet.

    PlanRun:
      type: object
      required:
        - id
        - depot_id
        - delivery_date
        - status
        - version
        - generated_by
        - generated_at
      properties:
        id:
          type: string
          description: Unique plan run identifier.
        depot_id:
          type: string
          description: Serving depot ID.
        delivery_date:
          type: string
          format: date
          description: Target delivery date.
        status:
          $ref: '#/components/schemas/PlanRunStatus'
        version:
          type: integer
          description: Monotonic plan revision version.
        generated_by:
          type: string
          description: User ID or system generator label.
        generated_at:
          type: string
          format: date-time
          description: Generation timestamp.
        ranking_config_json:
          type: object
          description: Active priority ranking parameters used for generation.
        summary_json:
          type: object
          description: Summary metrics of generated plan.
      description: Master daily dispatch planning run record.

    Trip:
      type: object
      required:
        - id
        - plan_run_id
        - vehicle_id
        - depot_id
        - delivery_date
        - trip_no
        - brand
        - district
        - status
        - plan_version
        - est_minutes
        - est_km
        - est_fuel_l
      properties:
        id:
          type: string
          description: Trip identifier.
        plan_run_id:
          type: string
          description: Associated planning run ID.
        vehicle_id:
          type: string
          description: Assigned vehicle code.
        depot_id:
          type: string
          description: Depot code.
        delivery_date:
          type: string
          format: date
          description: Date of execution.
        trip_no:
          type: integer
          enum: [1, 2]
          description: Trip sequence number for vehicle on date (1 or 2).
        brand:
          $ref: '#/components/schemas/Brand'
        district:
          type: string
          description: Target district served by trip.
        status:
          $ref: '#/components/schemas/TripStatus'
        plan_version:
          type: integer
          description: Current revision version of trip plan.
        depart_time:
          type: string
          nullable: true
          description: Planned departure time (HH:MM).
        est_minutes:
          type: integer
          description: Planned trip duration in minutes.
        est_km:
          type: number
          description: Total estimated travel distance in km.
        est_fuel_l:
          type: number
          description: Estimated fuel consumption in litres.
        confirmed_by:
          type: string
          nullable: true
          description: Dispatcher ID who confirmed the trip.
        confirmed_at:
          type: string
          format: date-time
          nullable: true
          description: Confirmation timestamp.
      description: Delivery trip record.

    TripCard:
      type: object
      required:
        - id
        - plan_run_id
        - delivery_date
        - trip_no
        - brand
        - district
        - depot_id
        - vehicle_id
        - vehicle_type
        - vehicle_temp
        - stop_count
        - plan_version
        - status
        - weight_used_kg
        - weight_cap_kg
        - volume_used_m3
        - volume_cap_m3
      properties:
        id:
          type: string
        plan_run_id:
          type: string
        delivery_date:
          type: string
          format: date
        trip_no:
          type: integer
          enum: [1, 2]
        brand:
          $ref: '#/components/schemas/Brand'
        district:
          type: string
        depot_id:
          type: string
        vehicle_id:
          type: string
        vehicle_type:
          $ref: '#/components/schemas/VehicleType'
        vehicle_temp:
          $ref: '#/components/schemas/TemperatureRequirement'
        stop_count:
          type: integer
        depart_time:
          type: string
          nullable: true
        plan_version:
          type: integer
        status:
          $ref: '#/components/schemas/TripStatus'
        weight_used_kg:
          type: number
        weight_cap_kg:
          type: number
        volume_used_m3:
          type: number
        volume_cap_m3:
          type: number
      description: Lightweight trip summary object used in loader and driver lists (D23).

    StopDetail:
      type: object
      required:
        - id
        - trip_id
        - order_id
        - seq
