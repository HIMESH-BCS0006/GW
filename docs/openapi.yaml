openapi: 3.1.0
info:
  title: Waypoint Delivery Planning System API
  description: OpenAPI 3.1 specification for the Waypoint Group delivery planning system.
  contact:
    email: tech-triathlon@rootcode.io
  version: 1.0.0
servers:
  - url: /api/v1
    description: Production API Base Endpoint
tags:
  - name: auth
    description: Authentication endpoints
  - name: reference
    description: Reference datasets and configuration endpoints
  - name: store_manager
    description: Store manager order and receipt endpoints
  - name: dispatcher
    description: Dispatcher planning and live monitoring endpoints
  - name: loader
    description: Warehouse loader endpoints
  - name: driver
    description: Driver trip and offline execution endpoints
paths:
  # ----------------------------------------------------
  # Auth & Reference Endpoints
  # ----------------------------------------------------
  /auth/login:
    post:
      operationId: login
      summary: User login to receive JWT bearer token
      tags:
        - auth
      x-role:
        - dispatcher
        - loader
        - driver
        - store_manager
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: dispatcher@waypoint.test
              password: Password123!
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
                token_type: bearer
                user:
                  id: USR001
                  username: dispatcher@waypoint.test
                  role: dispatcher
                  depot_ids:
                    - Peliyagoda
                    - Kandy
                  display_name: Lead Dispatcher
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Invalid username or password
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me:
    get:
      operationId: getCurrentUser
      summary: Get current authenticated user profile and scopes
      tags:
        - auth
      x-role:
        - dispatcher
        - loader
        - driver
        - store_manager
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: USR001
                username: dispatcher@waypoint.test
                role: dispatcher
                depot_ids:
                  - Peliyagoda
                  - Kandy
                display_name: Lead Dispatcher
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ref/outlets:
    get:
      operationId: getRefOutlets
      summary: Retrieve reference outlets catalog
      tags:
        - reference
      x-role:
        - dispatcher
        - loader
        - driver
        - store_manager
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Outlets catalog list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Outlet'
              example:
                - outlet_id: OUT001
                  brand: Fresh
                  district: Colombo
                  depot: Peliyagoda
                  dock_type: street
                  parking_constraint: van_only
                  window_open_time: "05:30"
                  window_close_time: "08:00"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ref/vehicles:
    get:
      operationId: getRefVehicles
      summary: Retrieve reference vehicles fleet catalog
      tags:
        - reference
      x-role:
        - dispatcher
        - loader
        - driver
        - store_manager
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Vehicles fleet list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
              example:
                - vehicle_id: VEH001
                  type: truck
                  temp: chilled
                  weight_cap_kg: 3610
                  volume_cap_m3: 19.4
                  fuel_type: diesel
                  km_per_l: 5.2
                  weekly_fuel_quota_l: 450
                  depot: Peliyagoda
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ref/calendar:
    get:
      operationId: getRefCalendar
      summary: Retrieve operating calendar reference data
      tags:
        - reference
      x-role:
        - dispatcher
        - loader
        - driver
        - store_manager
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Operating calendar days list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarDay'
              example:
                - date: "2025-08-01"
                  dow: 4
                  dow_name: Friday
                  is_weekend: 0
                  iso_year: 2025
                  iso_week: 31
                  is_payday: 0
                  festival_ramp: 0.3
                  is_holiday: 0
                  monsoon: 0
                  is_operating: 1
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ref/config:
    get:
      operationId: getRefConfig
      summary: Retrieve system reference parameters and operational config
      tags:
        - reference
      x-role:
        - dispatcher
        - loader
        - driver
        - store_manager
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Reference configuration parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefConfigResponse'
              example:
                cutoff_time: "16:00"
                budget_fresh_min: 270
                budget_style_tech_min: 480
                unit_constants:
                  Fresh:
                    chilled: { kg_per_unit: 1.2, m3_per_unit: 0.005 }
                business_clock: "2025-07-31T14:00:00+05:30"
                demo_mode: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ----------------------------------------------------
  # Store Manager Endpoints
  # ----------------------------------------------------
  /orders:
    post:
      operationId: createOrder
      summary: Place a new store delivery order before cutoff
      tags:
        - store_manager
      x-role:
        - store_manager
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              outlet_id: OUT004
              delivery_date: "2025-08-01"
              temp_requirement: chilled
              order_units: 150
              note: Weekly chilled replenishment
              client_op_id: c382a912-70b1-4f11-92b4-e4fbfd8e4011
      responses:
        '201':
          description: Order successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
              example:
                order:
                  id: ORD-20250801-001
                  outlet_id: OUT004
                  delivery_date: "2025-08-01"
                  placed_at: "2025-07-31T14:00:00+05:30"
                  status: SUBMITTED
                  temp_requirement: chilled
                  order_units: 150
                  order_weight_kg: 180.0
                  order_volume_m3: 0.75
                  rolled_over: false
                  deferral_count: 0
                  client_op_id: c382a912-70b1-4f11-92b4-e4fbfd8e4011
                confirmation_code: CONF-OUT004-801
                rolled_over: false
        '400':
          description: Non-operating day or invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOT_OPERATING_DAY
                  message: Delivery date is not an operating day
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Constraint violation or invalid date/constants error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOT_OPERATING_DAY
                  message: Delivery date is not an operating day or is in the past

    get:
      operationId: listOrders
      summary: List store manager own orders
      tags:
        - store_manager
      x-role:
        - store_manager
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
              example:
                - id: ORD-20250801-001
                  outlet_id: OUT004
                  delivery_date: "2025-08-01"
                  placed_at: "2025-07-31T14:00:00+05:30"
                  status: SUBMITTED
                  temp_requirement: chilled
                  order_units: 150
                  order_weight_kg: 180.0
                  order_volume_m3: 0.75
                  rolled_over: false
                  deferral_count: 0

  /orders/{id}:
    get:
      operationId: getOrderById
      summary: Get order details with timeline and deferral history
      tags:
        - store_manager
      x-role:
        - store_manager
        - dispatcher
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: ORD-20250801-001
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: ORD-20250801-001
                outlet_id: OUT004
                delivery_date: "2025-08-01"
                placed_at: "2025-07-31T14:00:00+05:30"
                status: SCHEDULED
                temp_requirement: chilled
                order_units: 150
                order_weight_kg: 180.0
                order_volume_m3: 0.75
                rolled_over: false
                deferral_count: 0
                trip_id: TRIP-20250801-01
                stop_id: STOP-20250801-001
                eta: "06:15"
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{id}/cancel:
    post:
      operationId: cancelOrder
      summary: Cancel an unfulfilled order with mandatory reason
      tags:
        - store_manager
      x-role:
        - store_manager
        - dispatcher
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: ORD-20250801-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
            example:
              reason: Store inventory adjusted; order no longer required.
              note: Cancelled prior to load confirmation.
      responses:
        '200':
          description: Cancelled order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: ORD-20250801-001
                outlet_id: OUT004
                delivery_date: "2025-08-01"
                placed_at: "2025-07-31T14:00:00+05:30"
                status: CANCELLED
                temp_requirement: chilled
                order_units: 150
                order_weight_kg: 180.0
                order_volume_m3: 0.75
                rolled_over: false
                deferral_count: 0
                cancel_reason: Store inventory adjusted; order no longer required.
        '409':
          description: Invalid transition (e.g. order already loaded or delivered)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_TRANSITION
                  message: Cannot cancel order in LOADED status

  /outlets/{id}/expected-deliveries:
    get:
      operationId: getOutletExpectedDeliveries
      summary: Get expected arrival ETAs for outlet planned orders
      tags:
        - store_manager
      x-role:
        - store_manager
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: OUT004
      responses:
        '200':
          description: Expected delivery stops and ETAs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripStop'
              example:
                - id: STOP-20250801-001
                  trip_id: TRIP-20250801-01
                  order_id: ORD-20250801-001
                  seq: 1
                  eta: "06:15"
                  service_start_est: "06:15"
                  service_min: 16
                  status: PENDING
                  receipt_status: NONE

  /stops/{id}/receipt:
    post:
      operationId: recordStopReceipt
      summary: Confirm delivery receipt or report goods discrepancy
      tags:
        - store_manager
      x-role:
        - store_manager
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: STOP-20250801-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordReceiptRequest'
            example:
              outcome: full
              note: Confirmed all 150 chilled units received in good condition.
              client_op_id: f721a833-2890-4100-881a-bb1902931102
      responses:
        '200':
          description: Goods receipt record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
              example:
                id: RCP-20250801-001
                stop_id: STOP-20250801-001
                outcome: full
                note: Confirmed all 150 chilled units received in good condition.
                confirmed_by: store@waypoint.test
                confirmed_at: "2025-08-01T06:35:00+05:30"

  /notifications:
    get:
      operationId: listNotifications
      summary: Retrieve user notification messages
      tags:
        - store_manager
      x-role:
        - store_manager
        - dispatcher
        - driver
        - loader
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
              example:
                - id: NOTIF001
                  event_id: EVT-20250801-01
                  audience_role: store_manager
                  audience_scope: OUT004

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      summary: Mark notification as read
      tags:
        - store_manager
      x-role:
        - store_manager
        - dispatcher
        - driver
        - loader
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: NOTIF001
      responses:
        '200':
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
              example:
                id: NOTIF001
                event_id: EVT-20250801-01
                audience_role: store_manager
                audience_scope: OUT004
                read_at: "2025-07-31T14:15:00+05:30"

  # ----------------------------------------------------
  # Dispatcher Planning Endpoints
  # ----------------------------------------------------
  /dashboard:
    get:
      operationId: getDashboard
      summary: Get dispatcher overview metrics and progress
      tags:
        - dispatcher
      x-role:
        - dispatcher
      security:
        - BearerAuth: []
      parameters:
        - name: depot_id
          in: query
          required: false
          schema:
            type: string
          description: Depot ID filter. Defaults if user has 1 depot. Returns 422 if missing when user has multiple depots, 403 if outside access.
          example: Peliyagoda
      responses:
        '200':
          description: Dispatcher dashboard metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
              example:
                date: "2025-08-01"
                depot_id: Peliyagoda
                business_now: "2025-07-31T14:00:00+05:30"
                cutoff:
                  cutoff_at: "2025-07-31T16:00:00+05:30"
                  minutes_remaining: 120
                  passed: false
                orders:
                  total: 120
                  by_brand:
                    Fresh: 80
                    Style: 25
                    Tech: 15
                  unassigned: 15
                  planned: 95
                  deferred: 10
                planning_progress:
                  planned: 95
                  total: 120
                vehicles:
                  total: 38
                  available: 34
                  in_workshop: 4
                  allocated: 28
                  loading: 5
                  active: 12
                alerts: []
                active_trips: []
        '403':
          description: Forbidden scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Missing required depot_id parameter for user with multiple depots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /dispatch/queue:
    get:
      operationId: getDispatchQueue
      summary: Get unallocated order dispatch queue
      tags:
        - dispatcher
      x-role:
        - dispatcher
      security:
        - BearerAuth: []
      parameters:
        - name: depot_id
          in: query
          required: false
          schema:
            type: string
          example: Peliyagoda
      responses:
        '200':
          description: Unallocated dispatch queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
              example:
                - id: ORD-20250801-001
                  outlet_id: OUT004
                  delivery_date: "2025-08-01"
                  placed_at: "2025-07-31T14:00:00+05:30"
                  status: SUBMITTED
                  temp_requirement: chilled
                  order_units: 150
                  order_weight_kg: 180.0
                  order_volume_m3: 0.75
                  rolled_over: false
                  deferral_count: 0
        '403':
          description: Forbidden scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /plans/generate:
    post:
      operationId: generatePlan
      summary: Generate daily dispatch plan using allocation engine
      tags:
        - dispatcher
      x-role:
        - dispatcher
      security:
        - BearerAuth: []
      parameters:
        - name: depot_id
          in: query
          required: false
          schema:
            type: string
          example: Peliyagoda
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratePlanRequest'
            example:
              depot_id: Peliyagoda
              delivery_date: "2025-08-01"
              regenerate: false
      responses:
        '200':
          description: Generated plan run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRun'
              example:
                id: RUN-20250801-PEL
                depot_id: Peliyagoda
                delivery_date: "2025-08-01"
                status: OPEN
                version: 1
                generated_by: dispatcher@waypoint.test
                generated_at: "2025-07-31T14:05:00+05:30"
        '400':
          description: Non-operating day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /plans:
    get:
      operationId: listPlans
      summary: List dispatch plan runs
      tags:
        - dispatcher
      x-role:
        - dispatcher
      security:
        - BearerAuth: []
      parameters:
        - name: depot_id
          in: query
          required: false
          schema:
            type: string
          example: Peliyagoda
      responses:
        '200':
          description: List of plan runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanRun'

  /plans/validate:
    post:
      operationId: validatePlan
      summary: Validate plan against hard rules H1-H12
      tags:
        - dispatcher
      x-role:
        - dispatcher
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidatePlanRequest'
            example:
              plan_run_id: RUN-20250801-PEL
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatePlanResponse'
              example:
                valid: true
                violations: []
        '422':
          description: Constraint violations detected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: CONSTRAINT_VIOLATION
                  message: Plan violates hard constraint H6 (volume capacity)
                  details:
                    violations:
                      - rule: H6
                        message: Volume capacity exceeded for vehicle VEH001
                        actual: 21.5
                        limit: 19.4

  /trips/{id}/orders:
    post:
      operationId: addOrderToTrip
      summary: Add order to a draft trip
      tags:
        - dispatcher
      x-role:
        - dispatcher
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: TRIP-20250801-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOrderToTripRequest'
            example:
              order_id: ORD-20250801-001
      responses:
        '200':
          description: Updated trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '422':
          description: Constraint violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trips/{id}/orders/{order_id}:
    delete:
      operationId: removeOrderFromTrip
      summary: Remove order from a draft trip
      tags:
        - dispatcher
      x-role:
        - dispatcher
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: TRIP-20250801-01
        - name: order_id
          in: path
          required: true
          schema:
            type: string
          example: ORD-20250801-001
      responses:
        '200':
          description: Updated trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'

  /orders/{id}/defer:
    post:
      operationId: deferOrder
      summary: Manually defer order with mandatory text reason
      tags:
        - dispatcher
      x-role:
        - dispatcher
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: ORD-20250801-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeferOrderRequest'
            example:
              reason_text: Manual deferral due to dock maintenance at destination.
              note: Deferred by dispatcher.
      responses:
        '200':
          description: Deferral record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deferral'
        '409':
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_TRANSITION
                  message: Cannot defer order in DELIVERED status

  /orders/{id}/requeue:
    post:
      operationId: requeueOrder
      summary: Return deferred order back to dispatch queue
      tags:
        - dispatcher
      x-role:
        - dispatcher
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: ORD-20250801-001
      responses:
        '200':
          description: Requeued order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /trips/{id}/confirm:
    post:
      operationId: confirmTrip
      summary: Confirm draft trip plan for dispatch
      tags:
        - dispatcher
      x-role:
        - dispatcher
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
