        note:
          type: string
          nullable: true
          description: Store manager receiving notes.
        confirmed_by:
          type: string
          description: Store manager user ID.
        confirmed_at:
          type: string
          format: date-time
          description: Confirmation timestamp.
        qr_token:
          type: string
          nullable: true
          description: Optional QR handshake verification token.
      description: Goods receipt confirmation record.

    Exception:
      type: object
      required:
        - id
        - trip_id
        - stop_id
        - type
        - reported_at
        - status
      properties:
        id:
          type: string
          description: Exception record ID.
        trip_id:
          type: string
          description: Affected trip ID.
        stop_id:
          type: string
          description: Affected stop ID.
        type:
          $ref: '#/components/schemas/ExceptionType'
        note:
          type: string
          nullable: true
          description: Driver explanation note.
        reported_at:
          type: string
          format: date-time
          description: Timestamp exception reported.
        status:
          $ref: '#/components/schemas/ExceptionStatus'
        decision:
          $ref: '#/components/schemas/ExceptionDecision'
          nullable: true
        decision_note:
          type: string
          nullable: true
          description: Dispatcher decision rationale.
        decided_by:
          type: string
          nullable: true
          description: Dispatcher user ID.
        decided_at:
          type: string
          format: date-time
          nullable: true
          description: Decision timestamp.
      description: Field delivery exception record.

    FuelLedger:
      type: object
      required:
        - vehicle_id
        - iso_year
        - iso_week
        - litres_committed
      properties:
        vehicle_id:
          type: string
          description: Vehicle code.
        iso_year:
          type: integer
          description: ISO calendar year.
        iso_week:
          type: integer
          description: ISO calendar week.
        litres_committed:
          type: number
          description: Accumulated litres committed for the ISO week.
      description: Vehicle weekly fuel consumption ledger.

    Event:
      type: object
      required:
        - id
        - type
        - occurred_at
        - entity
        - data
      properties:
        id:
          type: string
          description: Event unique identifier.
        type:
          $ref: '#/components/schemas/EventType'
        occurred_at:
          type: string
          format: date-time
          description: Event timestamp.
        scope:
          type: object
          properties:
            depot:
              type: string
            outlet:
              type: string
            vehicle:
              type: string
          description: Event filter scope metadata.
        entity:
          type: object
          required:
            - type
            - id
          properties:
            type:
              type: string
            id:
              type: string
          description: Target entity reference.
        data:
          type: object
          description: Payload context of event.
      description: System domain event payload for real-time notification streams.

    Notification:
      type: object
      required:
        - id
        - event_id
        - audience_role
      properties:
        id:
          type: string
          description: Notification ID.
        event_id:
          type: string
          description: Triggering domain event ID.
        audience_role:
          $ref: '#/components/schemas/Role'
        audience_scope:
          type: string
          nullable: true
          description: Specific scope constraint (depot/outlet ID).
        read_at:
          type: string
          format: date-time
          nullable: true
          description: Read timestamp.
      description: User notification entry.

    SyncOp:
      type: object
      required:
        - client_op_id
        - device_id
        - client_seq
        - user_id
        - op_type
        - payload
        - client_ts
        - received_at
        - result
      properties:
        client_op_id:
          type: string
          format: uuid
          description: Monotonic UUID assigned by client device.
        device_id:
          type: string
          description: Client device identifier.
        client_seq:
          type: integer
          description: Monotonic sequence number per client device.
        user_id:
          type: string
          description: User ID performing operation.
        op_type:
          type: string
          description: API operation type string.
        payload:
          type: object
          description: Operation parameters payload.
        client_ts:
          type: string
          format: date-time
          description: Device client timestamp.
        received_at:
          type: string
          format: date-time
          description: Server receipt timestamp.
        applied_at:
          type: string
          format: date-time
          nullable: true
          description: Server application timestamp.
        result:
          $ref: '#/components/schemas/SyncOpResult'
        reason:
          type: string
          nullable: true
          description: Rejection or conflict explanation.
      description: Offline operation synchronization log entry.

    # ----------------------------------------------------
    # API Request & Response Schemas
    # ----------------------------------------------------
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
      description: User credentials for login endpoint.

    LoginResponse:
      type: object
      required:
        - access_token
        - token_type
        - user
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: bearer
        user:
          $ref: '#/components/schemas/User'
      description: Authentication token payload response.

    CreateOrderRequest:
      type: object
      required:
        - outlet_id
        - temp_requirement
        - order_units
      properties:
        outlet_id:
          type: string
          description: Consignee outlet code.
        delivery_date:
          type: string
          format: date
          description: Target delivery date (optional; defaults to earliest operating day before 16:00 cutoff; D18).
        temp_requirement:
          $ref: '#/components/schemas/TemperatureRequirement'
        order_units:
          type: integer
          description: Total quantity of units ordered.
        order_weight_kg:
          type: number
          description: Weight fallback override in kg if units constant not used (D18).
        order_volume_m3:
          type: number
          description: Volume fallback override in m3 if units constant not used (D18).
        note:
          type: string
          description: Optional note from store manager.
        client_op_id:
          type: string
          format: uuid
          description: Idempotency client UUID.
      description: Order placement payload.

    CreateOrderResponse:
      type: object
      required:
        - order
        - confirmation_code
        - rolled_over
      properties:
        order:
          $ref: '#/components/schemas/Order'
        confirmation_code:
          type: string
          description: Order confirmation tracking code.
        rolled_over:
          type: boolean
          description: True if order placed after 16:00 cutoff and rolled to following run (D18).
        requested_delivery_date:
          type: string
          format: date
          description: Original requested delivery date if order was rolled over (D18).
      description: Order placement acknowledgment response.

    CancelOrderRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          description: Mandatory reason for order cancellation (D22).
        note:
          type: string
          description: Optional additional note (D22).
      description: Order cancellation body (D22).

    RecordReceiptRequest:
      type: object
      required:
        - outcome
      properties:
        outcome:
          $ref: '#/components/schemas/ReceiptOutcome'
        note:
          type: string
          description: Optional delivery discrepancy notes.
        client_op_id:
          type: string
          format: uuid
          description: Idempotency token.
      description: Store manager receipt confirmation payload.

    GeneratePlanRequest:
      type: object
      required:
        - depot_id
        - delivery_date
      properties:
        depot_id:
          type: string
        delivery_date:
          type: string
          format: date
        regenerate:
          type: boolean
          description: If true, keeps existing locked (CONFIRMED) trips.
      description: Plan generation request payload.

    AddOrderToTripRequest:
      type: object
      required:
        - order_id
      properties:
        order_id:
          type: string
      description: Payload to add an unassigned order to a draft trip.

    DeferOrderRequest:
      type: object
      required:
        - reason_text
      properties:
        reason_text:
          type: string
          description: Free-text manual deferral rationale (D22).
        note:
          type: string
          description: Optional additional note (D22).
        reason_code:
          $ref: '#/components/schemas/DeferralReasonCode'
          default: MANUAL
      description: Payload for manual order deferral by dispatcher (D22).

    ValidatePlanRequest:
      type: object
      required:
        - plan_run_id
      properties:
        plan_run_id:
          type: string
      description: Plan validation request payload.

    ValidatePlanResponse:
      type: object
      required:
        - valid
        - violations
      properties:
        valid:
          type: boolean
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
      description: Plan validation result payload.

    ExceptionDecisionRequest:
      type: object
      required:
        - decision
      properties:
        decision:
          $ref: '#/components/schemas/ExceptionDecision'
        note:
          type: string
        override_reason:
          type: string
          description: Mandatory override rationale if retrying non-mall stop past window.
      description: Dispatcher exception resolution decision payload.

    ResolveLoadCheckRequest:
      type: object
      required:
        - resolution
      properties:
        resolution:
          $ref: '#/components/schemas/LoadCheckResolution'
        note:
          type: string
      description: Dispatcher shortfall resolution payload.

    CreateLoadCheckRequest:
      type: object
      required:
        - order_id
        - plan_version
        - expected_qty
        - loaded_qty
        - issue
      properties:
        order_id:
          type: string
        plan_version:
          type: integer
        expected_qty:
          type: integer
        loaded_qty:
          type: integer
        issue:
          $ref: '#/components/schemas/LoadCheckIssue'
        note:
          type: string
        client_op_id:
          type: string
          format: uuid
      description: Loader shortfall reporting payload.

    ConfirmLoadRequest:
      type: object
      required:
        - plan_version
      properties:
        plan_version:
          type: integer
          description: Must match current trip plan version.
      description: Loader confirmation payload.

    StartTripRequest:
      type: object
      required:
        - plan_version
      properties:
        plan_version:
          type: integer
        client_op_id:
          type: string
          format: uuid
      description: Driver trip departure payload.

    RecordStopOutcomeRequest:
      type: object
      required:
        - outcome
        - completed_at
      properties:
        outcome:
          $ref: '#/components/schemas/StopOutcome'
        quantity_delivered:
          type: integer
          description: Must equal ordered units for delivered, strictly 0 < qty < ordered for partial, 0 for refused/closed (D20).
        received_by:
          type: string
          description: Required for delivered and partial (D20).
        outcome_note:
          type: string
        completed_at:
          type: string
          format: date-time
        client_op_id:
          type: string
          format: uuid
      description: Driver stop outcome recording payload (D20).

    RecordStopExceptionRequest:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/ExceptionType'
        note:
          type: string
        client_op_id:
          type: string
          format: uuid
        client_seq:
          type: integer
        client_ts:
          type: string
          format: date-time
        plan_version:
          type: integer
      description: Driver field exception reporting payload.

    SyncOperationItem:
      type: object
      required:
        - client_op_id
        - device_id
        - client_seq
        - op_type
        - payload
        - client_ts
      properties:
        client_op_id:
          type: string
          format: uuid
        device_id:
          type: string
        client_seq:
          type: integer
        op_type:
          type: string
        payload:
          type: object
        client_ts:
          type: string
          format: date-time
      description: Offline operation item queued on device.

    SyncBatchRequest:
      type: object
      required:
        - operations
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/SyncOperationItem'
      description: Batch offline operation sync replay payload.

    SyncOperationResultItem:
      type: object
      required:
        - client_op_id
        - result
      properties:
        client_op_id:
          type: string
          format: uuid
        result:
          $ref: '#/components/schemas/SyncOpResult'
        reason:
          type: string
      description: Replay result for a single synced client operation.

    SyncBatchResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncOperationResultItem'
      description: Response containing results for batch operation sync.

    RefConfigResponse:
      type: object
      required:
        - cutoff_time
        - budget_fresh_min
        - budget_style_tech_min
        - unit_constants
        - business_clock
        - demo_mode
      properties:
        cutoff_time:
          type: string
          example: "16:00"
        budget_fresh_min:
          type: integer
          example: 270
        budget_style_tech_min:
          type: integer
          example: 480
        unit_constants:
          type: object
          description: Calibrated kg and m3 per unit conversion factors by brand and temp.
        business_clock:
          type: string
          description: Active business clock time representation.
        demo_mode:
          type: boolean
          description: Indicates whether fixed demo time is active.
      description: System configuration parameter values response.

    DashboardSummary:
      type: object
      required:
        - date
        - depot_id
        - business_now
        - cutoff
        - orders
        - planning_progress
        - vehicles
        - alerts
        - active_trips
      properties:
        date:
          type: string
          format: date
        depot_id:
          type: string
        business_now:
          type: string
          format: date-time
        cutoff:
          type: object
          required:
            - cutoff_at
            - minutes_remaining
            - passed
          properties:
            cutoff_at:
              type: string
              format: date-time
            minutes_remaining:
              type: integer
            passed:
              type: boolean
        orders:
          type: object
          required:
            - total
            - by_brand
            - unassigned
            - planned
            - deferred
          properties:
            total:
              type: integer
            by_brand:
              type: object
              additionalProperties:
                type: integer
            unassigned:
              type: integer
            planned:
              type: integer
            deferred:
              type: integer
        planning_progress:
          type: object
          required:
            - planned
            - total
          properties:
            planned:
              type: integer
            total:
              type: integer
        vehicles:
          type: object
          required:
            - total
            - available
            - in_workshop
            - allocated
            - loading
            - active
          properties:
            total:
              type: integer
            available:
              type: integer
            in_workshop:
              type: integer
            allocated:
              type: integer
            loading:
              type: integer
            active:
              type: integer
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/AlertItem'
        active_trips:
          type: array
          items:
            type: object
            required:
              - trip_id
              - vehicle_id
              - status
              - stops_completed
              - stops_total
            properties:
              trip_id:
                type: string
              vehicle_id:
                type: string
              status:
                $ref: '#/components/schemas/TripStatus'
              stops_completed:
                type: integer
              stops_total:
                type: integer
      description: Dispatcher dashboard aggregate summary object (D21).

    PlanRunSummaryResponse:
      type: object
      required:
        - plan_run_id
        - status
        - version
        - trips
        - orders_served
        - orders_deferred
        - deferred_counts
        - capacity
        - reefer
        - fuel
        - constraint_health
      properties:
        plan_run_id:
          type: string
        status:
          $ref: '#/components/schemas/PlanRunStatus'
        version:
          type: integer
        trips:
          type: integer
        orders_served:
          type: integer
        orders_deferred:
          type: integer
        deferred_counts:
          type: object
          required:
            - by_class
            - by_code
          properties:
            by_class:
              type: object
              additionalProperties:
                type: integer
            by_code:
              type: object
              additionalProperties:
                type: integer
        capacity:
          type: object
          required:
            - weight_used_kg
            - weight_cap_kg
            - volume_used_m3
            - volume_cap_m3
          properties:
            weight_used_kg:
              type: number
            weight_cap_kg:
              type: number
            volume_used_m3:
              type: number
            volume_cap_m3:
              type: number
        reefer:
          type: object
          required:
            - chilled_demand
            - chilled_used
            - chilled_available
          properties:
            chilled_demand:
              type: integer
            chilled_used:
              type: integer
            chilled_available:
              type: integer
        fuel:
          type: array
          items:
            type: object
            required:
              - vehicle_id
              - quota_l
              - committed_l
              - remaining_l
            properties:
              vehicle_id:
                type: string
              quota_l:
                type: number
              committed_l:
                type: number
              remaining_l:
                type: number
        constraint_health:
          type: object
          required:
            - compliant
            - violations
          properties:
            compliant:
              type: boolean
            violations:
              type: array
              items:
                $ref: '#/components/schemas/Violation'
      description: Master plan run summary and metric breakdown object (D21).

    LiveMonitoringResponse:
      type: object
      required:
        - last_synced_at
        - trips
      properties:
        last_synced_at:
          type: string
          format: date-time
        trips:
          type: array
          items:
            type: object
            required:
              - vehicle_id
              - driver_name
              - trip_status
              - brand
              - district
              - stops_completed
              - stops_total
              - health
              - stops
            properties:
              vehicle_id:
                type: string
              driver_name:
                type: string
              trip_status:
                $ref: '#/components/schemas/TripStatus'
              brand:
                $ref: '#/components/schemas/Brand'
              district:
                type: string
              stops_completed:
                type: integer
              stops_total:
                type: integer
              next_stop:
                type: object
                nullable: true
                properties:
                  outlet_id:
                    type: string
                  eta:
                    type: string
              delay_min:
                type: integer
                nullable: true
              health:
                type: string
                enum: [on_schedule, delayed, blocked]
              stops:
                type: array
                items:
                  type: object
                  required:
                    - id
                    - outlet_id
                    - status
                    - eta
                    - pod_recorded
                  properties:
                    id:
                      type: string
                    outlet_id:
                      type: string
                    status:
                      $ref: '#/components/schemas/StopStatus'
                    eta:
                      type: string
                      nullable: true
                    arrived_at:
                      type: string
                      format: date-time
                      nullable: true
                    completed_at:
                      type: string
                      format: date-time
                      nullable: true
                    pod_recorded:
                      type: boolean
      description: Live monitoring dashboard payload with nested trips and stops (D21).

    AlertItem:
      type: object
      required:
        - id
        - type
        - severity
        - status
        - message
        - created_at
      properties:
        id:
          type: string
        type:
          type: string
          enum: [shortfall, exception, repeat_deferral, sync_conflict, capacity_shortage]
        severity:
          type: string
          enum: [info, warning, critical]
        status:
          type: string
          enum: [open, resolved]
        entity_ref:
          type: object
          nullable: true
          properties:
            type:
              type: string
            id:
              type: string
        message:
          type: string
        created_at:
          type: string
          format: date-time
      description: System alert detail item (D21).

    LoadListResponse:
      type: object
      required:
        - plan_version
        - trip
        - delivery_sequence
        - reverse_load_order
      properties:
        plan_version:
          type: integer
        trip:
          $ref: '#/components/schemas/TripCard'
        delivery_sequence:
          type: array
          items:
            $ref: '#/components/schemas/StopDetail'
        reverse_load_order:
          type: array
          items:
            $ref: '#/components/schemas/StopDetail'
      description: Warehouse load list response containing manifest sequence and reverse load order (D23).
