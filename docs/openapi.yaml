        - outlet_name
        - district
        - dock_type
        - parking_constraint
        - order_units
        - order_weight_kg
        - order_volume_m3
        - window_open_time
        - window_close_time
        - service_min
        - status
        - receipt_status
      properties:
        id:
          type: string
        trip_id:
          type: string
        order_id:
          type: string
        seq:
          type: integer
        outlet_id:
          type: string
        outlet_name:
          type: string
          example: Fresh Colombo 03
        district:
          type: string
        dock_type:
          $ref: '#/components/schemas/DockType'
        parking_constraint:
          $ref: '#/components/schemas/ParkingConstraint'
        order_units:
          type: integer
        order_weight_kg:
          type: number
        order_volume_m3:
          type: number
        window_open_time:
          type: string
        window_close_time:
          type: string
        eta:
          type: string
          nullable: true
        service_min:
          type: integer
        status:
          $ref: '#/components/schemas/StopStatus'
        receipt_status:
          $ref: '#/components/schemas/ReceiptStatus'
        arrived_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        outcome:
          $ref: '#/components/schemas/StopOutcome'
          nullable: true
        quantity_delivered:
          type: integer
          nullable: true
        received_by:
