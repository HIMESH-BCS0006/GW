<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Waypoint Logistics - Central Login Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-teal-500 selection:text-white">
  <!-- Background subtle gradient decor -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-teal-600/15 rounded-full blur-3xl"></div>
    <div class="absolute top-1/2 -right-40 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 left-1/3 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl"></div>
  </div>

  <header class="relative z-10 w-full max-w-6xl mx-auto px-6 py-6 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="h-10 w-10 bg-gradient-to-tr from-teal-500 to-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-teal-500/20">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </div>
      <div>
        <span class="text-xl font-extrabold tracking-tight text-white">WAYPOINT</span>
        <span class="text-xs ml-2 px-2 py-0.5 rounded-full bg-slate-800 text-teal-400 font-semibold border border-slate-700">Central Auth</span>
      </div>
    </div>
    <div class="text-xs text-slate-400 flex items-center space-x-2">
      <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span class="hidden sm:inline">System Live</span>
    </div>
  </header>

  <main class="relative z-10 flex-1 flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md">
      <!-- Login Card -->
      <div class="bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-2xl shadow-2xl p-8 transition-all">
        <div class="text-center mb-6">
          <h1 class="text-2xl font-bold tracking-tight text-white">Sign In to Waypoint</h1>
          <p class="text-sm text-slate-400 mt-1">Single authentication portal for all roles</p>
        </div>

        <!-- Error Alert -->
        <div id="errorAlert" class="hidden mb-5 p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs flex items-start space-x-2.5">
          <svg class="h-4 w-4 text-rose-400 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
          <span id="errorMessage">Invalid credentials</span>
        </div>

        <!-- Success/Redirecting Alert -->
        <div id="successAlert" class="hidden mb-5 p-3.5 rounded-xl bg-teal-500/10 border border-teal-500/30 text-teal-300 text-xs flex items-center space-x-2.5">
          <svg class="animate-spin h-4 w-4 text-teal-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          <span id="successMessage">Authenticated! Redirecting to your workspace...</span>
        </div>

        <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5" for="username">
              Username / Email
            </label>
            <div class="relative">
              <input
                id="username"
                name="username"
                type="text"
                required
                autocomplete="username"
                value="driver@waypoint.com"
                placeholder="e.g. driver@waypoint.com"
                class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all"
              />
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5" for="password">
              Password
            </label>
            <div class="relative">
              <input
                id="password"
                name="password"
                type="password"
                required
                autocomplete="current-password"
                value="pass123"
                placeholder="••••••••"
                class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all"
              />
            </div>
          </div>

          <button
            id="submitBtn"
            type="submit"
            class="w-full mt-2 bg-gradient-to-r from-teal-500 to-indigo-600 hover:from-teal-400 hover:to-indigo-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-teal-500/20 active:scale-[0.99] transition-all flex items-center justify-center space-x-2 disabled:opacity-50"
          >
            <span id="btnText">Sign In</span>
            <svg id="btnSpinner" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
          </button>
        </form>

        <!-- Quick Credentials Section -->
        <div class="mt-8 pt-6 border-t border-slate-800">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Quick Switch Account</span>
            <span class="text-[11px] text-slate-400">Password: <code class="font-mono text-teal-300">pass123</code></span>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <button
              type="button"
              onclick="fillAndSubmit('driver@waypoint.com', 'pass123')"
              class="flex flex-col items-start p-2.5 rounded-lg bg-slate-950/60 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 transition-all text-left group"
            >
              <span class="text-xs font-semibold text-emerald-400 group-hover:text-emerald-300">Driver</span>
              <span class="text-[10px] text-slate-400 truncate w-full">driver@waypoint.com</span>
            </button>

            <button
              type="button"
              onclick="fillAndSubmit('dispatcher@waypoint.com', 'pass123')"
              class="flex flex-col items-start p-2.5 rounded-lg bg-slate-950/60 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 transition-all text-left group"
            >
              <span class="text-xs font-semibold text-indigo-400 group-hover:text-indigo-300">Dispatcher</span>
              <span class="text-[10px] text-slate-400 truncate w-full">dispatcher@waypoint.com</span>
            </button>

            <button
              type="button"
              onclick="fillAndSubmit('loader@waypoint.com', 'pass123')"
              class="flex flex-col items-start p-2.5 rounded-lg bg-slate-950/60 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 transition-all text-left group"
            >
              <span class="text-xs font-semibold text-amber-400 group-hover:text-amber-300">Loader</span>
              <span class="text-[10px] text-slate-400 truncate w-full">loader@waypoint.com</span>
            </button>

            <button
              type="button"
              onclick="fillAndSubmit('storemanager@waypoint.com', 'pass123')"
              class="flex flex-col items-start p-2.5 rounded-lg bg-slate-950/60 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 transition-all text-left group"
            >
              <span class="text-xs font-semibold text-sky-400 group-hover:text-sky-300">Store Manager</span>
              <span class="text-[10px] text-slate-400 truncate w-full">storemanager@waypoint.com</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="relative z-10 w-full max-w-6xl mx-auto px-6 py-4 text-center text-xs text-slate-400">
    Waypoint Logistics Platform &bull; Dynamic Port Redirection
  </footer>

  <script>
    function fillAndSubmit(username, password) {
      document.getElementById('username').value = username;
      document.getElementById('password').value = password;
      handleLogin(null);
    }

    async function handleLogin(e) {
      if (e) e.preventDefault();

      const errorAlert = document.getElementById('errorAlert');
      const errorMessage = document.getElementById('errorMessage');
      const successAlert = document.getElementById('successAlert');
      const successMessage = document.getElementById('successMessage');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      errorAlert.classList.add('hidden');
      successAlert.classList.add('hidden');
      submitBtn.disabled = true;
      btnText.textContent = 'Authenticating...';
      btnSpinner.classList.remove('hidden');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      const hostname = window.location.hostname || 'localhost';
      const apiUrl = `http://${hostname}:8000/api/v1/auth/login`;

      try {
        const res = await fetch(apiUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, password }),
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.detail || 'Invalid username or password');
        }

        const data = await res.json();
        const token = data.access_token;
        const role = data.role;

        let targetUrl = '';
        let roleName = '';

        if (role === 'dispatcher') {
          targetUrl = `http://${hostname}:3000/?token=${token}`;
          roleName = 'Dispatcher Dashboard (Port 3000)';
        } else if (role === 'store_manager') {
          targetUrl = `http://${hostname}:3001/store?token=${token}`;
          roleName = 'Store Manager Portal (Port 3001)';
        } else if (role === 'driver') {
          targetUrl = `http://${hostname}:3002/#/driver?token=${token}`;
          roleName = 'Driver Delivery Console (Port 3002)';
        } else if (role === 'loader') {
          targetUrl = `http://${hostname}:3002/#/loader?token=${token}`;
          roleName = 'Loader Bay Screen (Port 3002)';
        } else {
          targetUrl = `http://${hostname}:3000/?token=${token}`;
          roleName = 'Waypoint Workspace';
        }

        successMessage.textContent = `Welcome ${data.display_name || username}! Redirecting to ${roleName}...`;
        successAlert.classList.remove('hidden');

        setTimeout(() => {
          window.location.href = targetUrl;
        }, 500);

      } catch (err) {
        errorMessage.textContent = err.message || 'Unable to connect to backend server. Please check your connection.';
        errorAlert.classList.remove('hidden');
        submitBtn.disabled = false;
        btnText.textContent = 'Sign In';
        btnSpinner.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
